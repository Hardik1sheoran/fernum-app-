appId: com.fernum.desktop
productName: Fernum
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!server/**"
  - "!data/**"
  - "!.env*"
  - "!scratch/**"
  - "!tests/**"
  - "!dodo.js"
  - "!render.yaml"
  - "!**/*.map"
asarUnpack:
  - "dist-electron/workers/**"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
